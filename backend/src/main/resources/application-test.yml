# Spring Framework Configuration
spring:

    # Database Connection Configuration
    datasource:
        url: jdbc:h2:mem:testdb
        username: sa
        password: ''

    # H2 Database Console Configuration
    h2:
        console:
            enabled: true
            path: /h2-console

    # JPA / Hibernate Configuration
    jpa:
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    # Flyway Migration Configuration
    flyway:
        enabled: true